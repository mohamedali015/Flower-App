name: "Validate PR Title"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Semantic PR Title Check
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            release
            feat
            hotfix
            build
            test

          scopes: |
            ^[A-Z0-9]+-\d+$
          scopeRequired: true

          subjectPattern: '^\s*([A-Z0-9]+-\d+)-.+$'
          subjectPatternError: "The title subject must follow the format: {TicketNum}-task name (e.g., FAT1-14-Setup Action)"